backend:
  name: github
  repo: Justus-Otundo/uleziborafc
  branch: main
  base_url: https://uleziborafc.justusotundo86.workers.dev
  auth_endpoint: /api/auth

media_folder: "img"
public_folder: "/img"

collections:
  # ===== NEWS ARTICLES =====
  - name: "news"
    label: "News & Events"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Achievement", "Training", "Enrollment", "Community", "Development", "Event", "Facility"] }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  # ===== COACHING STAFF =====
  - name: "coaches"
    label: "Coaching Staff"
    folder: "content/coaches"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "License", name: "license", widget: "string" }
      - { label: "Experience", name: "experience", widget: "string" }
      - { label: "Specialty", name: "specialty", widget: "string" }
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Twitter", name: "twitter", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show as featured head coach" }
      - { label: "Order", name: "order", widget: "number", default: 10 }

  # ===== TESTIMONIALS =====
  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string", hint: "e.g. Parent of U-12, Player" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Quote", name: "quote", widget: "text" }

  # ===== ACHIEVEMENTS =====
  - name: "achievements"
    label: "Achievements"
    folder: "content/achievements"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Team", name: "team", widget: "string", hint: "e.g. Senior Team, U16 Team" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon", name: "icon", widget: "select", options: ["trophy", "medal", "award", "futbol", "user-graduate", "graduation-cap"], default: "trophy" }

  # ===== SITE SETTINGS =====
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Contact Information"
        name: "contact"
        file: "content/settings/contact.json"
        fields:
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Hours", name: "hours", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "Twitter URL", name: "twitter", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
          - { label: "Google Maps Embed URL", name: "maps_embed", widget: "string", required: false }
          - { label: "Google Maps Link", name: "maps_link", widget: "string", required: false }

      - label: "Homepage Stats"
        name: "stats"
        file: "content/settings/stats.json"
        fields:
          - { label: "Students Trained", name: "students", widget: "string", default: "500+" }
          - { label: "Tournaments Won", name: "tournaments", widget: "string", default: "50+" }
          - { label: "Professional Coaches", name: "coaches", widget: "string", default: "15" }
          - { label: "Years of Excellence", name: "years", widget: "string", default: "10+" }

      - label: "Academy Info"
        name: "academy"
        file: "content/settings/academy.json"
        fields:
          - { label: "Academy Name", name: "name", widget: "string", default: "Ulezi Bora Academy Foundation" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Excellence in Sports & Education" }
          - { label: "About Text", name: "about", widget: "text" }
          - { label: "Mission", name: "mission", widget: "text" }
          - { label: "Vision", name: "vision", widget: "text" }
